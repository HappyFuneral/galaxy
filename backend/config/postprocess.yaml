quality:
  enabled: true
  denoise:
    enabled: true
    params: "1.5:1.2:6:6"
  eq:
    enabled: false
    contrast: 1.08
    brightness: 0.03
    saturation: 1.0
    gamma: 1.0
  sharpen:
    enabled: true
    params: "5:5:0.60"

fade:
  enabled: true
  duration_s: 0.35

highlight:
  enabled: true
  # used by VisualCache and glow enabling
  motion_thr: 0.08
  min_window_s: 0.35
  glow:
    enabled: true
    sigma: 1.3
    gamma: 1.0
    brightness: 0.02
    opacity: 0.18

captions:
  burn_in:
    enabled: true
    # Example style: "FontName=Arial,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=2,Shadow=1"
    force_style: "FontName=Arial,FontSize=18,BorderStyle=1,Outline=2,Shadow=1"

border:
  enabled: true
  edge_margin_ratio: 0.03
  box_thickness: 12
  box_color: "white@0.18"

speaker_focus:
  track:
    ema_alpha: 0.25
    max_points: 18
    max_delta_per_s: 0.35
postprocess:
  highlight:
    presets:
      tiktok:
        opacity: 0.18
        sigma: 1.1
      youtube:
        opacity: 0.10
        sigma: 0.8
  color_tint:
    enabled: false        # ⬅️ ALAPBÓL KI
    type: purple
    strength: 0.12

